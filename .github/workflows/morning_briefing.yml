name: Morning Briefing

on:
  schedule:
    - cron: '0 11 28 7 *'   # July 28 — 7am ET
    - cron: '0 11 29 7 *'   # July 29 — 7am ET
    - cron: '0 11 30 7 *'   # July 30 — 7am ET
  workflow_dispatch:          # allows manual trigger anytime

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance httpx python-dotenv sendgrid robin-stocks requests

      - name: Send morning briefing
        env:
          ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
          ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python3 morning_briefing.py
