name: Morning Briefing

on:
  schedule:
    # 14:00 UTC = 10:00am ET (EDT) — 30 minutes after the market open, so the
    # numbers are live same-day data rather than the prior session's close.
    - cron: '0 14 3 8 *'    # Monday August 3
  workflow_dispatch:          # allows manual trigger anytime

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance httpx python-dotenv sendgrid requests

      - name: Send morning briefing
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: python3 morning_briefing.py
